# The web app stack: postgres + webapp + dockerproxy. Each account's bot is its own
# stack (docker/bot.yml, started with docker/botctl <account> up) that joins this one's
# network, runetools-net.
#
# Fixed project name: the container, image and volume are runetools-… whatever
# folder compose is started from (default would be the folder name, "docker").
name: runetools

services:
  # ── web app (webapp/, PRO-88): account stats + login vault ─────────────────
  # `docker compose up -d postgres webapp`, then open http://127.0.0.1:8778/
  postgres:
    image: postgres:17-alpine
    environment:
      - POSTGRES_USER=runetools
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-runetools}
      - POSTGRES_DB=runetools
    volumes:
      - runetools-pgdata:/var/lib/postgresql/data
    ports:
      # localhost only; lets `pnpm dev` on the host use this database
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U runetools -d runetools"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  webapp:
    build:
      context: ../webapp
    depends_on:
      postgres:
        condition: service_healthy
    # same host user as the bots: it writes data/active_account, which they read
    user: "${RUNETOOLS_UID:-1000}:${RUNETOOLS_GID:-1000}"
    volumes:
      - ..:/repo:ro              # session logs (*/log/*.jsonl) are tailed, never written
      - ../data:/repo/data       # data/active_account + bot_token — create data/ first on Linux
    ports:
      - "127.0.0.1:8778:8778"   # localhost only: logins live in here
    environment:
      - DATABASE_URL=postgres://runetools:${POSTGRES_PASSWORD:-runetools}@postgres:5432/runetools
      - LOG_ROOTS=/repo
      - DATA_DIR=/repo/data
      # the browser on the host, plus the bot container pushing to http://webapp:8778
      - ALLOWED_HOSTS=127.0.0.1:8778,localhost:8778,webapp:8778
      # the name another laptop opens it by, e.g. this PC's Tailscale name (webapp/README.md
      # "From another laptop"); set PUBLIC_HOST in docker/.env
      - PUBLIC_HOST=${PUBLIC_HOST:-}
      # live view (PRO-89): the API bridges the page's VNC WebSocket to x11vnc over the
      # compose network, so no extra port is published for it
      # BOT_ACCOUNT (docker/.env): the account whose bot the page shows / starts / stops —
      # its stack is rt-<account> (docker/bot.yml), VNC on its proxy container
      - VNC_ADDR=rt-${BOT_ACCOUNT:-none}-proxy-1:5900
      - VNC_PASSWORD=${VNC_PASSWORD:-runetools}
      # session logs hold local wall time without a zone: set TZ to the zone the bots run
      # in (e.g. Europe/Warsaw in docker/.env) so "today" and day splits line up
      - TZ=${TZ:-UTC}
      # start / stop the bot container from the page (PRO-90), only through the allowlist proxy
      - DOCKER_PROXY_URL=http://dockerproxy:2375
      - BOT_CONTAINER=rt-${BOT_ACCOUNT:-none}-runetools-1
    restart: unless-stopped

  # The only container with the Docker socket (root on the host): it lets the web app
  # inspect / start / stop BOT_ACCOUNT's bot container and nothing else (webapp/apps/api/src/
  # docker-proxy.ts). Same image as the web app; on the compose network only, no port.
  dockerproxy:
    image: runetools-webapp
    pull_policy: never         # built by the webapp service
    depends_on:
      - webapp
    user: "0:0"                # the socket belongs to root
    command: ["node", "dist/docker-proxy.js"]
    environment:
      - BOT_CONTAINER=rt-${BOT_ACCOUNT:-none}-runetools-1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      disable: true
    restart: unless-stopped

networks:
  default:
    name: runetools-net   # fixed: the account stacks (docker/bot.yml) join it by this name
    # a home router's range (the bot containers' "LAN"), not Docker's 172.x — and not
    # this PC's own (192.168.1.x)
    ipam:
      config:
        - subnet: 192.168.88.0/24
          gateway: 192.168.88.1

volumes:
  runetools-pgdata:
