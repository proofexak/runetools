# Fixed project name: the container, image and volume are runetools-… whatever
# folder compose is started from (default would be the folder name, "docker").
name: runetools

services:
  runetools:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    # Run as your host user so files the bots write into the repo (logs, saved
    # calibration) stay owned by you on Linux. 1000 is the first user on
    # Ubuntu; set RUNETOOLS_UID/GID in docker/.env if `id -u` / `id -g` differ.
    # (Ignored by Docker Desktop's Windows bind mounts — harmless there.)
    user: "${RUNETOOLS_UID:-1000}:${RUNETOOLS_GID:-1000}"
    volumes:
      - ..:/app
      - ./bolt:/opt/bolt
      - runetools-userhome:/home/runetools   # RuneLite + Bolt state, survives restarts
    ports:
      # bound to localhost only — this is a bot control channel, not something
      # to expose on the network
      - "127.0.0.1:5900:5900"
    shm_size: "256mb"
    environment:
      - VNC=${VNC:-1}
      - VNC_PASSWORD=${VNC_PASSWORD:-runetools}
      - XVFB_RESOLUTION=${XVFB_RESOLUTION:-1280x800x24}
      - RUNELITE_FPS=${RUNELITE_FPS:-30}
      - RUNELITE_JAVA_OPTS=${RUNELITE_JAVA_OPTS:--Xmx512m -XX:+UseSerialGC}
      # Unattended mode (docker/README.md): set BOT + LAUNCH (and VALUE for a
      # launch that asks for a number) and the container runs lib.headless,
      # which logs in, runs the bot and restarts it. Unset = manual mode.
      - BOT=${BOT:-}
      - LAUNCH=${LAUNCH:-}
      - VALUE=${VALUE:-}
      # live status (PRO-99): each session-log line is also pushed to the web app (with
      # data/bot_token, which the app writes). Empty = don't push; the app still tails the files.
      - RUNETOOLS_APP_URL=${RUNETOOLS_APP_URL-http://webapp:8778}
    # Manual mode (BOT unset) runs lib.manual: it starts RuneLite + the bot menu when the web
    # app's Start button asks (PRO-90, through data/manual_request.json) and idles otherwise.
    command: ["sh", "-c", "if [ -n \"$$BOT\" ]; then exec python3 -m lib.headless; else exec python3 -m lib.manual; fi"]
    stop_grace_period: 30s   # SIGTERM = force stop + teardown; give it time
    stdin_open: true
    tty: true
    restart: unless-stopped

  # ── web app (webapp/, PRO-88): account stats + login vault ─────────────────
  # `docker compose up -d postgres webapp`, then open http://127.0.0.1:8778/
  postgres:
    image: postgres:17-alpine
    environment:
      - POSTGRES_USER=runetools
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-runetools}
      - POSTGRES_DB=runetools
    volumes:
      - runetools-pgdata:/var/lib/postgresql/data
    ports:
      # localhost only; lets `pnpm dev` on the host use this database
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U runetools -d runetools"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  webapp:
    build:
      context: ../webapp
    depends_on:
      postgres:
        condition: service_healthy
    # same host user as the bots: it writes data/active_account, which they read
    user: "${RUNETOOLS_UID:-1000}:${RUNETOOLS_GID:-1000}"
    volumes:
      - ..:/repo:ro              # session logs (*/log/*.jsonl) are tailed, never written
      - ../data:/repo/data       # data/active_account + bot_token — create data/ first on Linux
    ports:
      - "127.0.0.1:8778:8778"   # localhost only: logins live in here
    environment:
      - DATABASE_URL=postgres://runetools:${POSTGRES_PASSWORD:-runetools}@postgres:5432/runetools
      - LOG_ROOTS=/repo
      - DATA_DIR=/repo/data
      # the browser on the host, plus the bot container pushing to http://webapp:8778
      - ALLOWED_HOSTS=127.0.0.1:8778,localhost:8778,webapp:8778
      # the name another laptop opens it by, e.g. this PC's Tailscale name (webapp/README.md
      # "From another laptop"); set PUBLIC_HOST in docker/.env
      - PUBLIC_HOST=${PUBLIC_HOST:-}
      # live view (PRO-89): the API bridges the page's VNC WebSocket to x11vnc over the
      # compose network, so no extra port is published for it
      - VNC_ADDR=runetools:5900
      - VNC_PASSWORD=${VNC_PASSWORD:-runetools}
      # session logs hold local wall time without a zone: set TZ to the zone the bots run
      # in (e.g. Europe/Warsaw in docker/.env) so "today" and day splits line up
      - TZ=${TZ:-UTC}
      # start / stop the bot container from the page (PRO-90), only through the allowlist proxy
      - DOCKER_PROXY_URL=http://dockerproxy:2375
      - BOT_CONTAINER=runetools-runetools-1
    restart: unless-stopped

  # The only container with the Docker socket (root on the host): it lets the web app
  # inspect / start / stop runetools-runetools-1 and nothing else (webapp/apps/api/src/
  # docker-proxy.ts). Same image as the web app; on the compose network only, no port.
  dockerproxy:
    image: runetools-webapp
    pull_policy: never         # built by the webapp service
    depends_on:
      - webapp
    user: "0:0"                # the socket belongs to root
    command: ["node", "dist/docker-proxy.js"]
    environment:
      - BOT_CONTAINER=runetools-runetools-1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      disable: true
    restart: unless-stopped

volumes:
  runetools-userhome:
  runetools-pgdata:
