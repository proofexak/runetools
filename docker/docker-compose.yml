services:
  runetools:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    volumes:
      - ..:/app
      - ./bolt:/opt/bolt
      - runetools-home:/root
    ports:
      # bound to localhost only — this is a bot control channel, not something
      # to expose on the network
      - "127.0.0.1:5900:5900"
    shm_size: "1gb"
    environment:
      - VNC_PASSWORD=${VNC_PASSWORD:-runetools}
      - XVFB_RESOLUTION=${XVFB_RESOLUTION:-1280x800x24}
    stdin_open: true
    tty: true
    restart: unless-stopped

volumes:
  runetools-home:
